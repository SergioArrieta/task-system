services:
  db-tasks:
    image: postgres:15
    environment:
      POSTGRES_DB: tasks_db
      POSTGRES_PASSWORD: mysecretpassword
    networks:
      - task-network

  db-users:
    image: postgres:15
    environment:
      POSTGRES_DB: users_db
      POSTGRES_PASSWORD: mysecretpassword
    networks:
      - task-network

  service-tasks:
    build:
      context: ./serviceTasks
    depends_on:
      - db-tasks
    networks:
      - task-network

  service-users:
    build:
      context: ./serviceUsers
    depends_on:
      - db-users
    networks:
      - task-network

  api-gateway:
    build: ./APIGateway
    ports:
      - "8000:8080"
    depends_on:
      - service-users
      - service-tasks
    networks:
      - task-network

networks:
  task-network:
    driver: bridge